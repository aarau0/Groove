<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groove – Music Player</title>
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0a14">
<style>
:root{--bg:#0b0a14;--sf:rgba(255,255,255,.07);--tx:#f5f2fb;--mu:#a7a2bd;--ac:#ff9b54;--ac2:#1b1008;--ln:rgba(255,255,255,.11);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(70% 38% at 10% -4%,rgba(255,140,70,.28),transparent 70%),radial-gradient(60% 40% at 105% 18%,rgba(124,92,255,.26),transparent 70%),var(--bg);background-attachment:fixed;color:var(--tx);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(11,10,20,.55);backdrop-filter:blur(20px);padding:14px 16px 10px;z-index:5;border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-size:30px;letter-spacing:-.02em;font-weight:800}
#cnt{color:var(--mu);font-size:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;flex:none;filter:drop-shadow(0 0 10px rgba(255,155,84,.6))}
.logo .bg{fill:var(--ac)}
.logo .fg{stroke:var(--ac2);fill:none}
.bar{display:flex;gap:8px;margin-top:10px}
#q{flex:1;min-width:0;background:rgba(255,255,255,.07);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;font:inherit}
#q:focus{outline:0;border-color:rgba(255,155,84,.6);box-shadow:0 0 0 4px rgba(255,155,84,.15)}
.add{background:linear-gradient(135deg,#ffb36b,#ff7a45);color:var(--ac2);font-weight:700;border-radius:14px;padding:10px 14px;cursor:pointer;white-space:nowrap;box-shadow:0 6px 22px rgba(255,130,60,.4)}
#f{position:absolute;opacity:0;width:1px;height:1px}
#list{padding:8px 12px 140px}
.row{display:flex;align-items:center;margin:6px 0;border:1px solid var(--ln);border-radius:18px;background:rgba(255,255,255,.04)}
.row.cur{background:rgba(255,155,84,.12);border-color:rgba(255,155,84,.4);box-shadow:0 0 26px rgba(255,155,84,.2)}
.row.cur b{color:var(--ac)}
.pick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 8px;text-align:left}
.art{flex:none;width:50px;height:50px;border-radius:13px;box-shadow:0 6px 16px rgba(0,0,0,.45);object-fit:cover;background:#222}
.tx{min-width:0;display:flex;flex-direction:column}
.tx b,.tx small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{color:var(--mu)}
.del{color:var(--mu);font-size:22px;padding:8px 14px}
.empty{color:var(--mu);text-align:center;padding:60px 28px;margin:28px 6px;border:1px dashed var(--ln);border-radius:22px;background:rgba(255,255,255,.04)}
.badge{font-size:11px;background:rgba(255,155,84,.2);color:var(--ac);padding:2px 7px;border-radius:999px;margin-left:6px}
#mini{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(32,28,50,.58);backdrop-filter:blur(20px);border:1px solid var(--ln);border-radius:24px;display:flex;align-items:center;gap:12px;padding:8px 10px 10px 8px;z-index:6;box-shadow:0 12px 40px rgba(0,0,0,.55)}
#mini[hidden]{display:none}
#mini::after{content:"";position:absolute;left:18px;right:18px;bottom:4px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--ac) var(--p,0%),rgba(255,255,255,.12) var(--p,0%))}
#mopen{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.ic{width:28px;height:28px;fill:currentColor}
.pbtn{background:linear-gradient(135deg,#ffb36b,#ff7a45);color:var(--ac2);border-radius:50%;width:48px;height:48px;display:grid;place-items:center;box-shadow:0 0 18px rgba(255,140,70,.5)}
#mp{width:44px;height:44px}
#full{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s;visibility:hidden;overflow:hidden}
#full.open{transform:none;visibility:visible}
#full::before{content:"";position:absolute;inset:-25%;background:var(--art,none);filter:blur(80px) saturate(1.7);opacity:.5;z-index:-1}
#full::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,20,.1),rgba(11,10,20,.78));z-index:-1}
#close{align-self:flex-start;color:var(--mu);padding:7px 14px}
#ft{font-size:25px;font-weight:800;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fa{color:var(--mu);margin-bottom:14px}
.tm{display:flex;justify-content:space-between;width:100%;color:var(--mu);font-size:13px}
.ctl{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:20px}
.ctl.sub{gap:12px;margin-top:14px}
.pill{border:1px solid var(--ln);border-radius:999px;padding:7px 12px;font-size:14px;color:var(--tx);background:rgba(255,255,255,.07)}
.pill.on{background:linear-gradient(135deg,#ffb36b,#ff7a45);color:var(--ac2);border-color:transparent;box-shadow:0 0 20px rgba(255,140,70,.5)}
.tb{display:flex;justify-content:space-between;align-items:center;width:100%}
.cw{max-height:calc(min(76vw,320px,38vh) + 12px);overflow:hidden;margin:auto 0;padding:6px}
#cover{width:min(76vw,320px,38vh);aspect-ratio:1;border-radius:26px;border:1px solid rgba(255,255,255,.14);box-shadow:0 26px 60px rgba(0,0,0,.55);background:#222;object-fit:cover}
#prev,#next{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--ln)}
#seek{display:block;width:100%;height:48px;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 36 36" aria-hidden="true"><rect class="bg" width="36" height="36" rx="10"/><circle class="fg" cx="18" cy="18" r="11" stroke-width="2" opacity=".55"/><path class="fg" d="M13 16v4M18 12v12M23 15v6" stroke-width="3" stroke-linecap="round"/></svg>
      <h1>Groove</h1>
    </div>
    <span id="cnt"></span>
  </div>
  <div class="bar">
    <input id="q" type="search" placeholder="Search local or online..." aria-label="Search songs">
    <label class="add">Add<input id="f" type="file" accept="audio/*,.opus,.lrc,.txt" multiple></label>
  </div>
</header>

<main id="list"></main>

<div id="mini" hidden>
  <button id="mopen" aria-label="Open player">
    <img class="art" id="mart" alt="">
    <span class="tx"><b id="mt"></b><small id="ma"></small></span>
  </button>
  <button class="pbtn" id="mp" aria-label="Play or pause"></button>
</div>

<section id="full" aria-label="Now playing">
  <div class="tb">
    <button class="pill" id="close">Close</button>
    <button class="pill" id="lyb" style="display:none">Lyrics</button>
  </div>
  <div class="cw"><img id="cover" alt=""></div>
  <div id="ft"></div>
  <div id="fa"></div>
  <canvas id="seek" role="slider" aria-label="Seek"></canvas>
  <div class="tm"><span id="t1">0:00</span><span id="t2">0:00</span></div>
  <div class="ctl">
    <button id="prev" aria-label="Previous"></button>
    <button class="pbtn" id="fp" aria-label="Play or pause"></button>
    <button id="next" aria-label="Next"></button>
  </div>
  <div class="ctl sub">
    <button class="pill" id="shuf">Shuffle</button>
    <button class="pill" id="rep">Repeat: off</button>
  </div>
</section>

<script>
const $ = s => document.querySelector(s);
const au = new Audio();
const P = {
  play: 'M8 5v14l11-7z',
  pause: 'M6 5h4v14H6zM14 5h4v14h-4z',
  next: 'M6 6l8.5 6L6 18zM16 6h2v12h-2z',
  prev: 'M18 6l-8.5 6 8.5 6zM6 6h2v12H6z'
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = t => isFinite(t) ? Math.floor(t/60) + ':' + String(Math.floor(t%60)).padStart(2,'0') : '0:00';

let songs = [];          // local songs
let online = [];         // audius results
let cur = -1;
let mode = 'local';     // 'local' | 'online'
let shuf = false;
let rep = 0;
let url = null;
const REP = ['Repeat: off', 'Repeat: all', 'Repeat: one'];

// ========== LOCAL STORAGE ==========
const db = new Promise(r => {
  try {
    const q = indexedDB.open('groove', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('s', {keyPath:'id', autoIncrement:true});
    q.onsuccess = () => r(q.result);
    q.onerror = () => r(null);
  } catch(e) { r(null); }
});

async function tx(mode, fn) {
  const d = await db;
  if (!d) return;
  return new Promise(r => {
    try {
      const t = d.transaction('s', mode);
      const o = fn(t.objectStore('s'));
      t.oncomplete = () => r(o && o.result);
      t.onerror = () => r();
    } catch(e) { r(); }
  });
}

function parseLocal(s) {
  let n = s.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim();
  let a = 'Unknown artist';
  const i = n.indexOf(' - ');
  if (i > 0) { a = n.slice(0,i); n = n.slice(i+3); }
  n = s.tt || n;
  a = s.ta || a;
  if (s.art) s.artUrl = URL.createObjectURL(s.art);
  let h = 0;
  for (const c of n) h = (h*31 + c.charCodeAt(0)) % 360;
  return {
    ...s,
    title: n,
    artist: a,
    cover: s.artUrl || null,
    bg: s.art ? `url(${s.artUrl}) center/cover` : `linear-gradient(135deg,hsl(${h} 70% 55%),hsl(${(h+55)%360} 75% 38%))`,
    source: 'local'
  };
}

async function loadLocal() {
  const raw = (await tx('readonly', s => s.getAll())) || [];
  songs = raw.map(parseLocal);
  render();
}

// ========== AUDIUS ==========
async function searchAudius(query) {
  if (!query.trim()) {
    online = [];
    mode = 'local';
    render();
    return;
  }
  try {
    const res = await fetch(`https://api.audius.co/v1/tracks/search?query=${encodeURIComponent(query)}&app_name=Groove&limit=20`);
    const data = await res.json();
    online = (data.data || []).map(t => ({
      id: t.id,
      title: t.title,
      artist: t.user?.name || 'Unknown',
      cover: t.artwork?.['150x150'] || t.artwork?.['480x480'] || null,
      duration: t.duration,
      stream: `https://api.audius.co/v1/tracks/${t.id}/stream?app_name=Groove`,
      source: 'audius'
    }));
    mode = 'online';
    render();
  } catch (e) {
    console.error(e);
    online = [];
    render();
  }
}

// ========== RENDER ==========
function render() {
  const list = $('#list');
  const q = $('#q').value.trim().toLowerCase();

  let items = [];
  if (mode === 'online') {
    items = online;
    $('#cnt').textContent = online.length ? online.length + ' online' : '';
  } else {
    items = songs.filter(s => (s.title + s.artist).toLowerCase().includes(q));
    $('#cnt').textContent = songs.length ? songs.length + ' local' : '';
  }

  if (!items.length) {
    list.innerHTML = `<div class="empty">${mode === 'online' ? 'No results found' : 'Add some songs or search online'}</div>`;
    return;
  }

  list.innerHTML = items.map((s, i) => `
    <div class="row ${cur === i && mode === (s.source === 'local' ? 'local' : 'online') ? 'cur' : ''}" data-i="${i}">
      <button class="pick">
        <img class="art" src="${s.cover || ''}" alt="" onerror="this.style.background='#333'">
        <span class="tx">
          <b>${esc(s.title)}${s.source === 'audius' ? '<span class="badge">Online</span>' : ''}</b>
          <small>${esc(s.artist)}</small>
        </span>
      </button>
      ${s.source === 'local' ? `<button class="del" data-i="${i}">×</button>` : ''}
    </div>
  `).join('');
}

// ========== PLAY ==========
function play(i) {
  const list = mode === 'online' ? online : songs;
  if (i < 0 || i >= list.length) return;
  cur = i;
  const s = list[i];

  if (url) URL.revokeObjectURL(url);
  url = null;

  if (s.source === 'local') {
    url = URL.createObjectURL(s.blob);
    au.src = url;
  } else {
    au.src = s.stream;
  }

  au.play().catch(()=>{});
  updateUI();
  render();
}

function updateUI() {
  const list = mode === 'online' ? online : songs;
  const s = list[cur];
  if (!s) return;

  $('#mini').hidden = false;
  $('#mt').textContent = s.title;
  $('#ma').textContent = s.artist;
  $('#mart').src = s.cover || '';
  $('#ft').textContent = s.title;
  $('#fa').textContent = s.artist;
  $('#cover').src = s.cover || '';
  $('#cover').style.background = s.cover ? '' : '#333';

  $('#mp').innerHTML = ic(au.paused ? 'play' : 'pause');
  $('#fp').innerHTML = ic(au.paused ? 'play' : 'pause');
}

// ========== EVENTS ==========
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const q = e.target.value.trim();
    if (q) searchAudius(q);
    else {
      mode = 'local';
      online = [];
      render();
    }
  }
});

$('#q').addEventListener('input', () => {
  if (!$('#q').value.trim()) {
    mode = 'local';
    online = [];
    render();
  }
});

$('#list').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (!row) return;
  const i = +row.dataset.i;
  if (e.target.classList.contains('del')) {
    // delete local
    const s = songs[i];
    tx('readwrite', st => st.delete(s.id)).then(loadLocal);
    return;
  }
  play(i);
});

$('#mp').onclick = $('#fp').onclick = () => {
  if (au.paused) au.play(); else au.pause();
  updateUI();
};

$('#prev').onclick = () => {
  const list = mode === 'online' ? online : songs;
  play(cur <= 0 ? list.length - 1 : cur - 1);
};

$('#next').onclick = () => {
  const list = mode === 'online' ? online : songs;
  play(cur >= list.length - 1 ? 0 : cur + 1);
};

$('#close').onclick = () => $('#full').classList.remove('open');
$('#mopen').onclick = () => $('#full').classList.add('open');

$('#shuf').onclick = () => {
  shuf = !shuf;
  $('#shuf').classList.toggle('on', shuf);
};

$('#rep').onclick = () => {
  rep = (rep + 1) % 3;
  $('#rep').textContent = REP[rep];
  $('#rep').classList.toggle('on', rep > 0);
};

au.addEventListener('timeupdate', () => {
  const p = (au.currentTime / au.duration) * 100 || 0;
  $('#mini').style.setProperty('--p', p + '%');
  $('#t1').textContent = fmt(au.currentTime);
  $('#t2').textContent = fmt(au.duration);
});

au.addEventListener('ended', () => {
  if (rep === 2) play(cur);
  else $('#next').click();
});

au.addEventListener('play', updateUI);
au.addEventListener('pause', updateUI);

// File add
$('#f').onchange = async e => {
  const files = [...e.target.files];
  for (const f of files) {
    if (!f.type.startsWith('audio')) continue;
    const blob = f;
    await tx('readwrite', st => st.add({ name: f.name, blob, tagged: false }));
  }
  e.target.value = '';
  loadLocal();
};

// Init
loadLocal();
$('#mp').innerHTML = ic('play');
$('#fp').innerHTML = ic('play');
$('#prev').innerHTML = ic('prev');
$('#next').innerHTML = ic('next');
</script>
</body>
</html>
